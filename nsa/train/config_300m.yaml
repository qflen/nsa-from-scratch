# NSA-300M, 500M tokens, 32k context. Third scaling point in the
# writeup's scaling-trend plot. intermediate_size = 2752 keeps the
# Llama-style ~2.68x hidden ratio that the 100M (2048/768) and 150M
# (2400/896) configs use; micro_batch / grad_accum match the 100M and
# 150M recipe so the optimizer state and LR schedule comparison is clean.
run_id: nsa-300m-500m-32k
out_dir: /workspace/runs
tokenizer: huggyllama/llama-7b

arch:
  vocab_size: 32000
  n_layers: 20
  n_heads: 16
  head_dim: 64
  hidden_size: 1024
  intermediate_size: 2752
  max_position_embeddings: 32768
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tied_embeddings: true
  attention: nsa
  nsa_block_size_c: 64
  nsa_block_size_n: 64
  nsa_block_size_m: 64
  nsa_top_k: 16
  nsa_window_size: 512
  nsa_pool: mean
  nsa_gate_activation: sigmoid
  nsa_use_compressed_as_scorer: true

seq_len: 32768
micro_batch: 1
grad_accum: 8
total_tokens: 500_000_000
warmup_steps: 200
peak_lr: 3.0e-4
floor_lr: 3.0e-5
weight_decay: 0.1
log_every: 10
save_every: 2000
wandb: true
tags: [nsa, 300m, 32k]
