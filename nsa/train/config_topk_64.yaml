# Top-k ablation, top_k=64. 1B tokens, 32k context.
run_id: nsa-100m-1b-32k-topk64
out_dir: /workspace/runs
tokenizer: huggyllama/llama-7b

arch:
  vocab_size: 32000
  n_layers: 12
  n_heads: 12
  head_dim: 64
  hidden_size: 768
  intermediate_size: 2048
  max_position_embeddings: 32768
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tied_embeddings: true
  attention: nsa
  nsa_block_size_c: 64
  nsa_block_size_n: 64
  nsa_block_size_m: 64
  nsa_top_k: 64
  nsa_window_size: 512
  nsa_pool: mean
  nsa_gate_activation: sigmoid
  nsa_use_compressed_as_scorer: true

seq_len: 32768
micro_batch: 1
grad_accum: 8
total_tokens: 1_000_000_000
warmup_steps: 200
peak_lr: 3.0e-4
floor_lr: 3.0e-5
weight_decay: 0.1
log_every: 10
save_every: 2000
wandb: true
tags: [nsa, ablation, topk, 100m, 32k]
